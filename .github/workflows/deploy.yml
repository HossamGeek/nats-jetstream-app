name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run tests
      - name: Run tests
        run: npm test

      # 5. Build NestJS
      - name: Build NestJS
        run: npm run build

      # 6. Generate Docker image tag from commit SHA
      - name: Set image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 7. Set up Docker Buildx (Fast building & caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # 8. Login to Docker Hub using Access Token
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 9. Build Docker image
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nats-jetstream-app:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 10. Check GitHub CLI authentication
      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
        run: |
          gh auth status

      # 11. Copy Kubernetes manifests    
      - name: Copy Kubernetes manifests to Codespace
        env:
            GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
        run: |
            gh codespace cp \
            -c fluffy-zebra-jr9r66v9g9jf77g \
            -r k8s remote:/tmp/k8s     

      # 12. Deploy Kubernetes manifests
      - name: Deploy Kubernetes manifests
        env:
            GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
        run: |
             gh codespace ssh \
             -c fluffy-zebra-jr9r66v9g9jf77g \
             -- "kubectl apply -f /tmp/k8s/"
                
      # 13. Update Kubernetes Deployment inside Codespace
      - name: Deploy to Codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
        run: |
          gh codespace ssh \
            -c fluffy-zebra-jr9r66v9g9jf77g \
            -- "kubectl set image deployment/app-deployment nats-app=${{ secrets.DOCKER_USERNAME }}/nats-jetstream-app:${IMAGE_TAG}"

      # 14. Wait until Kubernetes rollout finishes
      - name: Wait for rollout
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
        run: |
          gh codespace ssh \
            -c fluffy-zebra-jr9r66v9g9jf77g \
            -- "kubectl rollout status deployment/app-deployment --timeout=120s"